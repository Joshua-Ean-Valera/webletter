<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Personalized Messages</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="auth-page">

  <main class="auth-shell">
    <section class="glass-card auth-card">
      <div class="brand">
        <div class="brand__dot"></div>
        <span class="brand__name">Personalized Messages</span>
      </div>

      <h1 class="auth-title">Welcome back</h1>
      <p class="auth-subtitle">Enter your name to view your message.</p>

      <form class="auth-form" onsubmit="loginByName(); return false;">
        <label class="field">
          <span>Name</span>
          <input id="loginName" type="text" placeholder="e.g. Allan" autocomplete="off">
        </label>

        <button class="btn btn-primary" type="submit">Continue</button>
        <p id="loginStatus" class="form-status" aria-live="polite"></p>
      </form>

      <div class="auth-footer">
        <a class="link" href="admin.html">Admin Dashboard</a>
      </div>
    </section>
  </main>

  <div id="authLoader" class="loader" aria-hidden="true">
    <span class="spinner"></span>
  </div>

  <script type="module" src="script.js"></script>

</body>
</html>

<!DOCTYPE html>
<html>
<head>
  <title>Faculty Messaging System</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

  <h1>Faculty Messaging System</h1>

  <form onsubmit="login(); return false;">

    <input
      type="email"
      id="email"
      placeholder="Email"
    >

    <input
      type="password"
      id="password"
      placeholder="Password"
    >

    <button type="submit">
      Login
    </button>

  </form>

</div>

<!-- <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script> -->
<script type="module" src="script.js"></script>

</body>
</html>

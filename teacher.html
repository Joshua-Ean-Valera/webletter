<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Appreciation Letter</title>
  <link rel="stylesheet" href="style.css">
</head>

<body class="teacher-page" onload="loadTeacherMessage()">

<main class="teacher-shell">
  <section class="letter-page">
    <header class="letter-page__header">
      <div class="letter-page__title-wrap">
        <h1 class="letter-page__title">Appreciation Letter</h1>
        <span class="letter-page__underline"></span>
      </div>
      <button class="letter-page__logout" onclick="logout()">Logout</button>
    </header>

    <article class="letter-page__paper">
      <div class="letter-page__content" id="teacherMessage">Loading message...</div>
    </article>
  </section>
</main>

<script type="module" src="script.js"></script>

</body>
</html>

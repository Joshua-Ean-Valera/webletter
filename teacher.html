<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Teacher Letter</title>
  <link rel="stylesheet" href="style.css">
</head>

<body onload="loadTeacherMessage()">

<div class="container">

  <h1>Teacher Dashboard</h1>

  <div style="display:flex;gap:10px;justify-content:center;align-items:center;">
    <button onclick="logout()">Logout</button>
    <button id="openBtn" onclick="openEnvelope()">Open Letter</button>
  </div>

  <hr>

  <h3 id="teacherEmail"></h3>

  <div class="envelope-wrap">
    <div id="envelope" class="envelope" style="--env-flap:#e9e9e9; --env-body:#f0f0f0">
      <div class="flap"></div>
      <div class="body">
        <div class="letter" id="teacherMessage">Loading message...</div>
      </div>
    </div>
  </div>

</div>

<script type="module" src="script.js"></script>

</body>
</html>

<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Teacher Letter</title>
  <link rel="stylesheet" href="style.css">
</head>

<body onload="loadTeacherMessage()">

<div class="container">

  <h1>Teacher Dashboard</h1>

  <div style="display:flex;gap:10px;justify-content:center;align-items:center;">
    <button onclick="logout()">Logout</button>
    <button id="openBtn" onclick="openEnvelope()">Open Letter</button>
  </div>

  <hr>

  <h3 id="teacherEmail"></h3>

  <div class="compose">
    <input id="toName" placeholder="To (name)" />
    <input id="fromName" placeholder="From (your name)" />
    <textarea id="messageInput" rows="5" placeholder="Write your letter here..."></textarea>
    <label style="font-size:14px;margin-top:6px;display:block">Envelope color</label>
    <select id="colorSelect">
      <option value="#e9e9e9">Classic</option>
      <option value="#ffd7e2">Pink</option>
      <option value="#e6f7ff">Blue</option>
      <option value="#fff7d9">Cream</option>
      <option value="#e8f6e8">Green</option>
    </select>
    <div style="display:flex;gap:8px;margin-top:10px;">
      <button onclick="previewLetter()" style="flex:1">Preview Letter</button>
      <button onclick="closeEnvelope()" style="flex:1;background:#666">Close</button>
    </div>
  </div>

  <div class="envelope-wrap">
    <div id="envelope" class="envelope" style="--env-flap:#e9e9e9; --env-body:#f0f0f0">
      <div class="flap"></div>
      <div class="body">
        <div class="letter" id="teacherMessage">Loading message...</div>
      </div>
    </div>
  </div>

</div>

<script type="module" src="script.js"></script>

</body>
</html>
